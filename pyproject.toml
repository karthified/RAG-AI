[project]
name = "my-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karthik", email = "karthikarjun1@email.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "notebook>=7.6.5",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
my-ai = "my_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
